aid: altimeter-capital
name: Altimeter Capital
description: >-
  Altimeter Capital is a technology-focused investment firm founded in 2008 by Brad Gerstner in Boston,
  Massachusetts, launched during the financial crisis with less than $3 million from friends and family.
  Headquartered in both Boston, MA and Menlo Park, CA (on Sand Hill Road), Altimeter runs a life-cycle
  crossover platform that backs technology companies from early stage through IPO and beyond: it manages a
  long/short public equity fund investing in technology companies alongside private growth equity funds
  targeting both early- and later-stage tech ventures. Brad Gerstner, founder, chairman and CEO,
  looks for platforms rather than products - businesses with network effects, expanding margins, and
  leaders who can adapt and scale - and has been a vocal proponent of an AI "supercycle" driven by
  accelerated computing and data-center demand. Altimeter also sponsored two SPACs (Altimeter Growth Corp,
  which merged with Grab, and Altimeter Growth Corp 2). Notable private and pre-IPO investments include
  Snowflake, Confluent, Okta, UiPath, GitLab, Unity, Roblox, SoFi, Plaid, ByteDance, Epic Games, dbt Labs,
  Baseten, and Anthropic. Reported assets under management have ranged from roughly $6.75B (Sep 2024) to
  higher figures across sources; Altimeter self-describes as "a technology-focused investment firm built by
  a founder for founders."
